[server]
headless = true
enableStaticServing = true

# PretendardGOV (vendored under static/fonts, SIL OFL 1.1). One variable file
# serves every weight; the browser fetches it once and caches it.
[[theme.fontFaces]]
family = "PretendardGOV"
url = "app/static/fonts/PretendardGOVVariable.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "PretendardGOV"
url = "app/static/fonts/PretendardGOVVariable.woff2"
weight = 500
style = "normal"

[[theme.fontFaces]]
family = "PretendardGOV"
url = "app/static/fonts/PretendardGOVVariable.woff2"
weight = 600
style = "normal"

[[theme.fontFaces]]
family = "PretendardGOV"
url = "app/static/fonts/PretendardGOVVariable.woff2"
weight = 700
style = "normal"

[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f7f7"
textColor = "#222222"
linkColor = "#2563eb"
borderColor = "#dddddd"
dataframeBorderColor = "#ebebeb"
codeBackgroundColor = "#f7f7f7"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
font = "PretendardGOV"
headingFont = "PretendardGOV"
codeFont = "PretendardGOV"
baseFontWeight = 400
headingFontWeights = [600, 600, 600, 600, 600, 600]
